# Builds a signed, installable APK when a version tag (v1.2.3) is pushed and
# publishes it as a GitHub release whose notes list the commits since the
# previous tag.
#
# Repository secrets:
#   ANDROID_KEYSTORE_BASE64    the release keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its store password
#   ANDROID_KEY_ALIAS          the key alias
#   ANDROID_KEY_PASSWORD       the key password
# Every release must be signed with the same key, or Android refuses to
# install it over an earlier one.
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and tags, for the changelog.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check the version tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag#v}"
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $tag is not v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          flutter pub get
          flutter analyze
          flutter test
          cargo test --manifest-path rust/Cargo.toml

      - name: Build the signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          # The run number only grows, so each release can update the last.
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ github.run_number }}"
          rm -f "$ANDROID_KEYSTORE_PATH"
          apk="chat_tool_harness-${GITHUB_REF_NAME}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - name: Write the changelog
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            if [ -n "$previous" ]; then
              echo "## Changes since $previous"
              range="$previous..${GITHUB_REF_NAME}"
            else
              echo "## Changes"
              range="${GITHUB_REF_NAME}"
            fi
            echo
            git log --no-merges --reverse --pretty='- %s (%h)' "$range"
            echo
            echo "Install \`chat_tool_harness-${GITHUB_REF_NAME}.apk\` on Android."
            echo "It updates an earlier release in place."
          } > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "${GITHUB_REF_NAME}" == *-* ]] && prerelease="--prerelease"
          gh release create "${GITHUB_REF_NAME}" \
            "chat_tool_harness-${GITHUB_REF_NAME}.apk" \
            "chat_tool_harness-${GITHUB_REF_NAME}.apk.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            $prerelease
